[project]
name = "male-flower-count"
version = "0.1.0"
description = "Desktop workflow for counting particles from image data with SAM2-assisted segmentation and Napari visualization"
readme = "README.md"
requires-python = ">=3.11.6"
dependencies = [
    "glasbey>=0.3.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "napari[all]>=0.7.0",
    "opencv-python>=4.13.0.92",
    "openpyxl>=3.1.5",
    "torch>=2.10.0",
]
